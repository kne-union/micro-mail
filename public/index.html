<!DOCTYPE html>
<html lang="zh-cn">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="%PUBLIC_URL%/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#4183F0" />
  <meta name="description" content="Powered By KneUnion Fastify App" />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/favicon-192x192.png" />
  <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
  <title>邮件网关</title>
  <style>
    #app-boot {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #f6f7f9;
    }

    #app-boot img {
      width: 72px;
      height: 72px;
    }

    #app-boot-name {
      font-size: 16px;
      line-height: 24px;
      font-weight: 500;
      color: rgba(0, 0, 0, 0.88);
    }
  </style>
</head>

<body>
  <div id="app-boot">
    <img id="app-boot-logo" alt="" src="%PUBLIC_URL%/favicon.svg" />
    <div id="app-boot-name"></div>
  </div>
  <script>
    (function () {
      var base = String(window.runtimePublicUrl || '').replace(/\/+$/, '');
      if (base === '/') {
        base = '';
      }
      var img = document.getElementById('app-boot-logo');
      if (base && img) {
        var src = img.getAttribute('src') || '';
        if (src.charAt(0) === '/' && src.indexOf(base + '/') !== 0) {
          img.src = base + src;
        }
      }
      var name = document.getElementById('app-boot-name');
      if (name) {
        name.textContent = document.title;
      }
    })();
  </script>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
  <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
</body>

</html>
