<!-- subject -->
请补充资料：{{mail.subject}}
<!-- description -->
清单列表风：请客户补充材料时使用，勾选项可按业务改写。
<!-- html -->
<div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;font-size:14px;line-height:1.7;color:#1f1f1f;max-width:560px;">
  <p style="margin:0 0 12px;">您好{{mail.from.first.name}}，</p>
  <p style="margin:0 0 12px;">关于您的来信「{{mail.subject}}」，为继续处理，还请补充以下信息：</p>
  <div style="background:#fafafa;border:1px solid #f0f0f0;border-radius:8px;padding:14px 16px;margin:0 0 16px;">
    <ol style="margin:0;padding-left:18px;color:#434343;">
      <li style="margin-bottom:6px;">相关订单号 / 工单号</li>
      <li style="margin-bottom:6px;">问题复现步骤或截图</li>
      <li style="margin-bottom:0;">期望的处理结果</li>
    </ol>
  </div>
  <p style="margin:0 0 12px;">资料齐全后我们会尽快推进，谢谢配合。</p>
  <p style="margin:24px 0 0;">
    {{account.name}}<br/>
    <span style="color:#8c8c8c;font-size:13px;">{{account.address}}</span>
  </p>
</div>
