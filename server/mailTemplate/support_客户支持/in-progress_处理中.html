<!-- subject -->
进展同步：{{mail.subject}}
<!-- description -->
进度胶囊风：告知客户问题处理中及当前阶段。
<!-- html -->
<div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;font-size:14px;line-height:1.7;color:#1f1f1f;max-width:560px;">
  <p style="margin:0 0 8px;">
    <span style="display:inline-block;padding:2px 10px;border-radius:999px;background:#e6f4ff;color:#1677ff;font-size:12px;font-weight:600;">处理中</span>
  </p>
  <p style="margin:0 0 12px;">您好{{mail.from.first.name}}，</p>
  <p style="margin:0 0 12px;">您反馈的「{{mail.subject}}」我们已在跟进。当前阶段：排查与确认方案（请按实际修改）。</p>
  <p style="margin:0 0 12px;">有新进展会第一时间同步；若您有补充信息，欢迎直接回复。</p>
  <p style="margin:24px 0 0;padding-top:12px;border-top:1px dashed #e8e8e8;">
    <strong>{{account.name}}</strong> · 客户支持<br/>
    <span style="color:#8c8c8c;font-size:13px;">{{account.address}}</span>
  </p>
</div>
