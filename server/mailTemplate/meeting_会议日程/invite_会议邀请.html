<!-- subject -->
会议邀请：请确认是否方便参加
<!-- description -->
日程卡片风：发起会议邀请，时间/地点处请改成实际信息。
<!-- html -->
<div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;font-size:14px;line-height:1.7;color:#1f1f1f;max-width:560px;">
  <p style="margin:0 0 12px;">您好{{mail.from[0].name}}，</p>
  <p style="margin:0 0 14px;">希望与您安排一次沟通，详情如下：</p>
  <table role="presentation" cellpadding="0" cellspacing="0" style="width:100%;border-collapse:collapse;background:#fafafa;border-radius:10px;overflow:hidden;border:1px solid #f0f0f0;">
    <tr><td style="padding:10px 16px;border-bottom:1px solid #f0f0f0;color:#8c8c8c;width:88px;">主题</td><td style="padding:10px 16px;border-bottom:1px solid #f0f0f0;">（请填写会议主题）</td></tr>
    <tr><td style="padding:10px 16px;border-bottom:1px solid #f0f0f0;color:#8c8c8c;">时间</td><td style="padding:10px 16px;border-bottom:1px solid #f0f0f0;">（请填写日期与时段）</td></tr>
    <tr><td style="padding:10px 16px;border-bottom:1px solid #f0f0f0;color:#8c8c8c;">方式</td><td style="padding:10px 16px;border-bottom:1px solid #f0f0f0;">线上 / 线下（请注明链接或地址）</td></tr>
    <tr><td style="padding:10px 16px;color:#8c8c8c;">备注</td><td style="padding:10px 16px;">相关来信：{{mail.subject}}</td></tr>
  </table>
  <p style="margin:16px 0 0;">若时间不合适，请回复您方便的时段，我们再协调。</p>
  <p style="margin:24px 0 0;"><strong>{{account.name}}</strong><br/><span style="color:#8c8c8c;font-size:13px;">{{account.address}}</span></p>
</div>
